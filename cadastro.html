<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Criar Conta | BeeManager</title>

    <link rel="stylesheet" href="cadastro.css" />
  </head>

  <body>
    <main class="pagina-cadastro">
      <div class="card-cadastro">
        <!-- LOGO -->

        <div class="logo-cadastro">
          <span>🐝</span>
          <h1>BeeManager</h1>
        </div>

        <!-- TÍTULO -->

        <div class="titulo-cadastro">
          <h2>Crie sua conta!</h2>
          <p>Comece a gerenciar seus apiários.</p>
        </div>

        <!-- FORMULÁRIO -->

        <form id="formCadastro">
          <div class="campo-cadastro">
            <label for="nome">Nome completo</label>

            <input
              type="text"
              id="nome"
              placeholder="Digite seu nome"
              required
            />
          </div>

          <div class="campo-cadastro">
            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <div class="campo-cadastro">
            <label for="senha">Senha</label>

            <input
              type="password"
              id="senha"
              placeholder="Crie uma senha"
              minlength="6"
              required
            />
          </div>

          <div class="campo-cadastro">
            <label for="confirmarSenha">Confirmar senha</label>

            <input
              type="password"
              id="confirmarSenha"
              placeholder="Digite novamente sua senha"
              minlength="6"
              required
            />
          </div>

          <button type="submit" class="btn-cadastrar">Criar minha conta</button>
        </form>
        <div
          id="mensagemCadastro"
          class="mensagem-formulario"
          role="status"
          aria-live="polite"
        ></div>

        <!-- VOLTAR AO LOGIN -->

        <div class="login-cadastro">
          <p>Já tem uma conta?</p>

          <a href="login.html"> Entrar </a>
        </div>
      </div>
    </main>

    <script type="module" src="cadastro.js"></script>
  </body>
</html>
